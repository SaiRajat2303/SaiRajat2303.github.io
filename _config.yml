# URL config — set `url` to your custom domain or leave empty for *.github.io
url: ""
baseurl: ""

# Build
markdown: kramdown
highlighter: rouge
permalink: /:title/
sass:
  style: compressed

# Collections
collections:
  news:
    output: false

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: none

# Plugins (Jekyll 4.x via GitHub Actions)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .github
