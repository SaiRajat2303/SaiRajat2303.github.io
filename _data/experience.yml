- id: tenstorrent
  short: Tenstorrent
  org: Tenstorrent
  role: RISC-V Cores & System-IP Engineer
  dates: Jan 2024 → Present
  location: Bengaluru, India
  logo: /assets/img/logos/tenstorrent.svg
  in_header: true
  summary: >-
    RTL design and verification of Tenstorrent's high-performance RISC-V core
    (Ascalon) and surrounding system IP — IOMMU, APLIC, AXI bridge, CHI↔AXI
    bridge, multi-cluster L1/L2 caches. Co-author of RV TESTER, a (soon-to-be
    open-sourced) testbench methodology for RISC-V cores presented at RISC-V
    Summit North America 2025.
  highlights:
    - >-
      RTL design + integration of IOMMU, APLIC and a peripheral AXI bridge —
      enabled the DOOM + Linux-on-Ascalon demo at RISC-V Summit 2025, Santa
      Clara. [SV]
    - >-
      Co-author and developer of RV TESTER, a (soon-to-be open-sourced)
      testbench methodology for RISC-V cores; presented at RISC-V Summit NA
      2025. [SV, C++]
    - >-
      First author of poster "Unleashing the Penguin: Programmable Device
      Model for verifying RISC-V IOMMU using Linux" — accepted at RISC-V
      Summit EU 2026.
    - >-
      Built an emulation-compatible multi-cluster L1 + L2 cache model on
      Synopsys Zebu — caught intra/inter-cluster coherency and secure-access
      bugs in simulation. [SV, C++]
    - >-
      Designed a novel end-of-simulation memory-checking methodology with a
      micro-architectural acceleration approach; presented as a poster to Jim
      Keller (CEO, Tenstorrent) in Austin, TX. [C++]
    - >-
      Designed and integrated the Shared-Cache CHI↔AXI Bridge (CAB) RTL block,
      handling memory-ordering for AXI requests to main memory. [SV]
    - >-
      Feature owner for PMA, PMP, and Command-Queue verification on the RISC-V
      IOMMU; built UVM test plans and coverage. [SV, UVM]
    - >-
      Built a DV environment that emulates DMA devices via a trickbox region —
      verified Linux device-driver sequences on TT-Ascalon using AXI
      transactors firing DMA reads/writes through the IOMMU. [SV, C++]
    - >-
      Tracer infrastructure for transactions across cluster components
      (AXI bridge / switch / sizer / ring, N-Trace, MMR space) — measurably
      improved debug throughput.
    - >-
      Coherency monitor between LSU and L2 (synthesizable, emulation-
      compatible); checkers for SVADU and AXI response-timeout that caught
      critical RTL + perf bugs. [SV, AMBA CHI-E]
    - >-
      Reference model for Patch-RAM verification on Tenstorrent's 8-core CPU
      cluster. [SV, C++]

