<section class="section section--contact" id="contact">
  <div class="section__head">
    <span class="section__num">04</span>
    <h2 class="section__title">Contact me</h2>
  </div>

  <ul class="contact-grid" role="list">
    <li>
      <a class="contact-card contact-card--mail"
         href="mailto:{{ site.author.email }}"
         aria-label="Email Sai Rajat Goparaju">
        <span class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
        </span>
        <span class="contact-card__name">Email</span>
        <span class="contact-card__handle mono">{{ site.author.email }}</span>
      </a>
    </li>

    <li>
      <a class="contact-card contact-card--github"
         href="https://github.com/{{ site.author.github }}"
         target="_blank" rel="noopener"
         aria-label="GitHub profile">
        <span class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.08c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.71 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.6.23 2.78.11 3.07.74.81 1.19 1.84 1.19 3.1 0 4.44-2.7 5.42-5.27 5.7.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.8.55C20.21 21.38 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5Z"/>
          </svg>
        </span>
        <span class="contact-card__name">GitHub</span>
        <span class="contact-card__handle mono">@{{ site.author.github }}</span>
      </a>
    </li>

    <li>
      <a class="contact-card contact-card--linkedin"
         href="{{ site.author.linkedin_url }}"
         target="_blank" rel="noopener"
         aria-label="LinkedIn profile">
        <span class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.86-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.55V9h3.57v11.45ZM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0Z"/>
          </svg>
        </span>
        <span class="contact-card__name">LinkedIn</span>
        <span class="contact-card__handle mono">/in/{{ site.author.linkedin }}</span>
      </a>
    </li>
  </ul>
</section>
